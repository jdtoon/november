name: november

services:
  bff:
    image: november-bff
    build:
      context: ./bff
      dockerfile: Dockerfile
    environment:
      Auth__Mode: Mock
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "5080:8080"

  payments:
    image: november-payments
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        APP: payments

  approvals:
    image: november-approvals
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        APP: approvals

  incoming:
    image: november-incoming
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        APP: incoming

  shell:
    image: november-shell
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        APP: shell
    environment:
      BFF_UPSTREAM: http://bff:8080
      PAYMENTS_UPSTREAM: http://payments:8080
      APPROVALS_UPSTREAM: http://approvals:8080
      INCOMING_UPSTREAM: http://incoming:8080
    ports:
      - "3000:8080"
    depends_on:
      - bff
      - payments
      - approvals
      - incoming
