parameters:
  - name: serviceConnection
    type: string
  - name: acrName
    type: string
  - name: repository
    type: string
  - name: context
    type: string
  - name: buildArguments
    type: string
    default: --pull
  - name: tag
    type: string

steps:
  - task: AzureCLI@2
    displayName: Build and push ${{ parameters.repository }}:${{ parameters.tag }}
    inputs:
      azureSubscription: ${{ parameters.serviceConnection }}
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        az acr login --name ${{ parameters.acrName }}
        image=${{ parameters.acrName }}.azurecr.io/${{ parameters.repository }}:${{ parameters.tag }}
        docker build ${{ parameters.buildArguments }} \
          --file ${{ parameters.context }}/Dockerfile \
          --tag "$image" \
          ${{ parameters.context }}
        docker push "$image"
