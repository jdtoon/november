parameters:
  - name: serviceConnection
    type: string
  - name: resourceGroup
    type: string
  - name: location
    type: string
  - name: parameterFile
    type: string
  - name: imageTag
    type: string
  - name: deployApps
    type: boolean
    default: true
  - name: runWhatIf
    type: boolean
    default: false
  - name: stepName
    type: string
    default: deploy

steps:
  - task: AzureCLI@2
    displayName: Ensure resource group ${{ parameters.resourceGroup }}
    inputs:
      azureSubscription: ${{ parameters.serviceConnection }}
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        az group create \
          --name ${{ parameters.resourceGroup }} \
          --location ${{ parameters.location }} \
          --output none

  - ${{ if eq(parameters.runWhatIf, true) }}:
      - task: AzureCLI@2
        displayName: What-if ${{ parameters.parameterFile }}
        inputs:
          azureSubscription: ${{ parameters.serviceConnection }}
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            az deployment group what-if \
              --resource-group ${{ parameters.resourceGroup }} \
              --template-file infra/main.bicep \
              --parameters ${{ parameters.parameterFile }} imageTag=${{ parameters.imageTag }} deployApps=${{ lower(parameters.deployApps) }}

  - task: AzureCLI@2
    name: ${{ parameters.stepName }}
    displayName: Deploy ${{ parameters.parameterFile }} (deployApps=${{ parameters.deployApps }})
    inputs:
      azureSubscription: ${{ parameters.serviceConnection }}
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        az deployment group create \
          --name november-$(Build.BuildId)-${{ lower(parameters.deployApps) }} \
          --resource-group ${{ parameters.resourceGroup }} \
          --template-file infra/main.bicep \
          --parameters ${{ parameters.parameterFile }} imageTag=${{ parameters.imageTag }} deployApps=${{ lower(parameters.deployApps) }} \
          --query properties.outputs \
          --output json > outputs.json
        echo "##vso[task.setvariable variable=acrName;isOutput=true]$(jq -r .acrName.value outputs.json)"
        echo "##vso[task.setvariable variable=acrLoginServer;isOutput=true]$(jq -r .acrLoginServer.value outputs.json)"
        echo "##vso[task.setvariable variable=shellUrl;isOutput=true]$(jq -r .shellUrl.value outputs.json)"
